<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aarón Alcaide</title>
  <meta name="description" content="Aarón Alcaide — escritor." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Aarón Alcaide" />
  <meta property="og:description" content="Escritor." />
  <meta property="og:url" content="https://aaronalcaide.me/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Aarón Alcaide" />
  <meta name="twitter:description" content="Escritor." />
  <link rel="icon" type="image/svg+xml" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --white: #ffffff;
      --black: #111111;
      --gray:  #6f6f6f;
      --line:  #dedede;
    }
    html, body { width: 100%; height: 100%; }
    body {
      min-height: 100vh;
      background: var(--white);
      color: var(--black);
      font-family: 'EB Garamond', serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5vh 6vw;
      opacity: 0;
      animation: fadeIn 0.7s ease 0.05s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    header {
      padding-bottom: 2.2rem;
      border-bottom: 1px solid var(--line);
    }
    .wordmark {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 460px;
    }

    .eyebrow {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(1.3rem, 2.6vw, 1.6rem);
      font-weight: 500;
      line-height: 1.3;
      margin-bottom: 1.1rem;
    }
    h1 a {
      color: var(--black);
      text-decoration: none;
      border-bottom: 1px solid var(--black);
      padding-bottom: 2px;
      transition: opacity 0.25s ease;
    }
    h1 a:hover { opacity: 0.55; }

    .desc {
      font-size: 0.95rem;
      font-style: italic;
      line-height: 1.75;
      color: var(--gray);
      max-width: 400px;
    }

    footer {
      padding-top: 2.2rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: var(--gray);
    }
    footer a {
      color: var(--gray);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.25s ease, border-color 0.25s ease;
    }
    footer a:hover { color: var(--black); border-color: var(--black); }

    a:focus-visible {
      outline: 1px solid var(--black);
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      body { padding: 4vh 7vw; }
      footer { flex-direction: column; gap: 0.6rem; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header>
    <span class="wordmark">Aarón Alcaide</span>
  </header>

  <main>
    <p class="eyebrow">Proyecto</p>
    <h1><a href="https://thedehron.com" target="_blank" rel="noopener">VOCES DEL DEhRON</a></h1>
    <p class="desc">Empieza por donde quieras. Cada relato se sostiene solo. Lo raro viene después, cuando llevas dos o tres y empiezas a reconocer cosas que nadie te ha explicado.</p>
  </main>

  <footer>
    <span>&copy; Aarón Alcaide</span>
    <a href="mailto:aaronalcaidex@gmail.com">aaronalcaidex@gmail.com</a>
  </footer>

</body>
</html>
