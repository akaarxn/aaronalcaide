<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planes">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Una columna estrecha tipo app: lista de vales con líneas finas, hojas que suben desde abajo en el móvil. */
@font-face { font-family: 'Inter'; src: url('/fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Courier Prime'; src: url('/fonts/courier-prime.woff2') format('woff2'); font-weight: 400; font-display: swap; }

:root {
  --blanco: #ffffff;
  --negro: #111111;
  --texto: #222222;
  --gris: #6f716e;
  --linea: #e4e6e3;
  --fondo-2: #f6f7f6;
  --verde: #93bfa4;          /* eucalipto, el de aaronalcaide.me */
  --verde-suave: #edf4ef;
  --verde-texto: #3b6a4f;
  --sombra: 0 18px 40px -18px rgba(17, 17, 17, .35);
  --f-texto: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Courier Prime', 'Courier New', ui-monospace, monospace;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; background: var(--blanco); }
body {
  min-height: 100vh; background: var(--blanco); color: var(--negro);
  font: 400 16px/1.5 var(--f-texto); font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
}
body.lock { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--negro); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.gris { color: var(--gris); }
.mono { font-family: var(--f-mono); }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- Cabecera ---------- */
.aviso-prueba {
  background: var(--verde-suave); color: var(--verde-texto); font-size: 13px; line-height: 1.4; text-align: center;
  padding-block: 8px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 26px 18px; }
.marca { font-size: 40px; font-weight: 500; letter-spacing: -0.055em; line-height: 1; color: var(--negro); text-decoration: none; }
.marca .dot { color: var(--verde); }
.quien {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
  border: 1px solid var(--linea); border-radius: 999px; font-size: 14px; font-weight: 500;
}
.quien::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--verde); }

.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--linea); margin-bottom: 8px; }
.tabs button {
  position: relative; padding: 10px 0 12px; font-size: 15px; font-weight: 500; color: var(--gris);
}
.tabs button[aria-current="page"] { color: var(--negro); }
.tabs button[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--negro); }
.tabs .n { margin-left: 6px; font-size: 12px; color: var(--gris); font-variant-numeric: tabular-nums; }

main.wrap { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent;
  font-size: 15px; font-weight: 550; line-height: 1.2; text-align: center; text-decoration: none;
  transition: background-color .15s ease, transform .1s ease;
}
.btn:active:not([disabled]) { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-negro { background: var(--negro); color: var(--blanco); }
.btn-borde { background: var(--blanco); color: var(--negro); border-color: var(--negro); }
.btn-suave { background: var(--fondo-2); color: var(--negro); }
.btn-ancho { width: 100%; }
.btn-peq { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 8px; }
.btn svg { width: 18px; height: 18px; flex: none; }
@media (hover: hover) {
  .btn-negro:hover:not([disabled]) { background: #2a2a2a; }
  .btn-borde:hover:not([disabled]), .btn-suave:hover:not([disabled]) { background: var(--verde-suave); }
}
.enlace {
  font-size: 14px; color: var(--negro); border-bottom: 1px solid var(--verde); padding: 2px 0; line-height: 1.3;
}
@media (hover: hover) { .enlace:hover { border-bottom-color: var(--negro); } }
.enlace.gris { color: var(--gris); border-bottom-color: var(--linea); }
.cargando-btn { position: relative; color: transparent !important; pointer-events: none; }
.cargando-btn::after {
  content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--blanco); border-right-color: transparent; animation: gira .7s linear infinite;
}
.btn-borde.cargando-btn::after, .btn-suave.cargando-btn::after, .enlace.cargando-btn::after { border-color: var(--negro); border-right-color: transparent; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ---------- Listas ---------- */
.barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 0 6px; }
.barra p { font-size: 14px; color: var(--gris); }
.lista { list-style: none; }
.vale { display: flex; flex-direction: column; gap: 6px; padding: 18px 0; border-bottom: 1px solid var(--linea); min-width: 0; }
.vale-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.vale h3 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; overflow-wrap: anywhere; }
.vale .meta { font-size: 14px; color: var(--gris); }
.vale .det { font-size: 14px; color: var(--texto); overflow-wrap: anywhere; }
.estado { flex: none; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.estado.pend { border: 1px solid var(--linea); color: var(--gris); }
.estado.ok { background: var(--verde-suave); color: var(--verde-texto); }
.acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 6px; }
.canj { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 16px; }
.dia {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border-radius: 10px; background: var(--verde-suave); padding: 8px 0; height: max-content;
}
.dia .m { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--verde-texto); }
.dia .d { font-size: 24px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.dia .s { font-size: 11px; color: var(--gris); text-transform: capitalize; }
.dia.pasado { background: var(--fondo-2); }
.dia.pasado .m { color: var(--gris); }
.subt { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gris); padding-top: 22px; }
.vacio { padding: 40px 0 28px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.vacio h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.vacio p { color: var(--gris); max-width: 42ch; font-size: 15px; }
.codigo-caja { margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--linea); }
.codigo-caja label { display: block; font-size: 14px; color: var(--gris); margin-bottom: 8px; }
.fila { display: flex; gap: 8px; }
.fila input { flex: 1; min-width: 0; }

/* ---------- Formularios ---------- */
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo > span { font-size: 14px; font-weight: 500; }
.campo em { font-style: normal; font-weight: 400; color: var(--gris); }
input[type="text"], input[type="password"], input[type="date"], input:not([type]), textarea {
  width: 100%; min-width: 0; font-size: 16px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid #d6d9d5; background: var(--blanco); color: var(--negro);
}
input[type="date"] { min-height: 48px; -webkit-appearance: none; appearance: none; }
input:focus, textarea:focus { outline: none; border-color: var(--negro); }
input::placeholder, textarea::placeholder { color: #9a9d99; }
textarea { resize: vertical; line-height: 1.45; }
.codigo-in { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--negro); }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.error { font-size: 14px; font-weight: 500; color: var(--negro); background: var(--fondo-2); border-left: 3px solid var(--negro); padding: 8px 12px; border-radius: 4px; }
.para-l { font-size: 15px; }
.para-l strong { font-weight: 600; }

/* ---------- Pantallas de entrada ---------- */
.pantalla { min-height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; justify-content: center; padding-block: 40px; }
.pantalla .marca { font-size: 56px; margin-bottom: 26px; }
.pantalla form, .pantalla .bloque { display: flex; flex-direction: column; gap: 14px; max-width: 380px; }
.pantalla h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }
.pantalla p { color: var(--gris); font-size: 15px; }
.nombres-btns { display: flex; flex-direction: column; gap: 10px; }

/* ---------- Hojas ---------- */
#hoja { position: fixed; inset: 0; z-index: 50; }
.hoja-fondo { position: absolute; inset: 0; background: rgba(17, 17, 17, .42); opacity: 0; transition: opacity .2s; }
.hoja {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh;
  display: flex; flex-direction: column; background: var(--blanco); border-radius: 18px 18px 0 0;
  transform: translateY(102%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px); outline: none;
}
#hoja.on .hoja-fondo { opacity: 1; }
#hoja.on .hoja { transform: none; }
.hoja-cab {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px));
}
.hoja-cab h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
.cerrar { width: 36px; height: 36px; border-radius: 50%; background: var(--fondo-2); font-size: 22px; line-height: 1; flex: none; }
.hoja-cuerpo {
  overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px;
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) 18px max(20px, env(safe-area-inset-left, 0px));
}
.hoja-pie {
  display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px solid var(--linea);
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
}
.hoja-pie .btn { flex: 1 1 auto; }
.confirmar { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 10px; background: var(--fondo-2); }
.confirmar p { font-size: 15px; font-weight: 500; }
.confirmar div { display: flex; gap: 8px; }
@media (min-width: 640px) {
  .hoja {
    left: 50%; top: 50%; bottom: auto; width: min(560px, calc(100% - 40px)); max-height: min(88vh, 860px);
    border-radius: 16px; transform: translate(-50%, -47%); opacity: 0; transition: transform .2s ease, opacity .2s ease;
    box-shadow: var(--sombra);
  }
  #hoja.on .hoja { transform: translate(-50%, -50%); opacity: 1; }
  .hoja-pie { justify-content: flex-end; }
  .hoja-pie .btn { flex: 0 0 auto; }
}
.imagen-vale img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--linea); }
.esperando { aspect-ratio: 1920 / 1000; border-radius: 8px; background: var(--fondo-2); }
.enlace-fila { display: flex; gap: 8px; }
.enlace-fila input { flex: 1; min-width: 0; font: 400 14px/1.2 var(--f-mono) !important; padding: 10px 12px !important; color: var(--gris) !important; }
.cartera-fila { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; padding: 14px; border-radius: 10px; background: var(--fondo-2); }
.cartera-fila > div { flex: 1 1 220px; min-width: 0; font-size: 14px; }
.cartera-fila strong { display: block; font-weight: 600; }
.cartera-fila span { color: var(--gris); }

/* ---------- Página del vale (al escanear el QR) ---------- */
.v-cab { padding-block: 26px 10px; }
.tarjeta { border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
.tarjeta-sup { padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
.tarjeta-sup .de { font-size: 14px; color: var(--gris); display: flex; align-items: center; gap: 8px; }
.tarjeta-sup .de::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--verde); flex: none; }
.tarjeta-sup h1 { font-size: clamp(30px, 8vw, 40px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.05; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.tarjeta-sup .det { color: var(--texto); font-size: 16px; overflow-wrap: anywhere; }
.tarjeta-inf {
  display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 14px 20px; background: var(--fondo-2);
  border-top: 1px dashed #cfd3ce; font-size: 13px;
}
.tarjeta-inf dt { color: var(--gris); }
.tarjeta-inf dd { font-weight: 500; }
.tarjeta-inf .mono { font-size: 14px; letter-spacing: .04em; }
.bloque-v { padding: 26px 0 0; display: flex; flex-direction: column; gap: 14px; }
.bloque-v h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
.hecho-v { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 14px; background: var(--verde-suave); }
.hecho-v .eti { font-size: 13px; font-weight: 600; color: var(--verde-texto); letter-spacing: .06em; text-transform: uppercase; }
.hecho-v .fecha { font-size: 26px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; }
.hecho-v .cuenta { font-size: 14px; color: var(--verde-texto); }
.botones-v { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 640px) { .botones-v { flex-direction: row; flex-wrap: wrap; } }
.pie-v { padding: 30px 0 calc(40px + env(safe-area-inset-bottom, 0px)); }

.cal { border: 1px solid var(--linea); border-radius: 14px; padding: 12px 10px 10px; }
.cal-cab { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 6px; }
.cal-cab strong { font-size: 16px; font-weight: 600; }
.cal-nav { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--negro); }
.cal-nav[disabled] { opacity: .25; cursor: default; }
@media (hover: hover) { .cal-nav:not([disabled]):hover { background: var(--fondo-2); } }
.cal-sem, .cal-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.cal-sem span { font-size: 12px; color: var(--gris); line-height: 2.2; }
.cal-d { height: clamp(40px, 11vw, 46px); border-radius: 10px; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--negro); }
.cal-d.hoy { box-shadow: inset 0 0 0 1px var(--linea); }
.cal-d.sel { background: var(--negro); color: var(--blanco); box-shadow: none; }
.cal-d[disabled] { color: #c3c6c2; cursor: default; }
@media (hover: hover) { .cal-d:not([disabled]):not(.sel):hover { background: var(--verde-suave); } }

/* ---------- Varios ---------- */
#aviso {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  background: var(--negro); color: var(--blanco); padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
  width: max-content; max-width: calc(100% - 40px); text-align: center;
}
#aviso.on { opacity: 1; transform: translate(-50%, 0); }
.cargando { min-height: 50vh; display: grid; place-items: center; color: var(--gris); font-size: 14px; }
#imprimir { display: none; }
@media print {
  @page { margin: 12mm; }
  body { padding: 0; }
  body > *:not(#imprimir) { display: none !important; }
  #imprimir { display: block !important; }
  #imprimir img { width: 100%; height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>

<div id="app"><div class="cargando">Cargando…</div></div>
<div id="hoja" hidden></div>
<div id="aviso" role="status" aria-live="polite"></div>
<div id="imprimir" aria-hidden="true"></div>
<noscript><p style="padding:24px">Esta página necesita JavaScript.</p></noscript>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(() => {
'use strict';

// ================================================================
//  Configuración
// ================================================================
const CFG = Object.assign({ supabaseUrl: '', supabaseKey: '', wallet: false }, window.PLANES_CONFIG || {});
const PRUEBA = !(CFG.supabaseUrl && CFG.supabaseKey);
const CARTERA = !PRUEBA && CFG.wallet === true;
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';

// ================================================================
//  Utilidades
// ================================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => iso(new Date());
const aFecha = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const sumarDias = (s, n) => { const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); };
const diasHasta = s => Math.round((aFecha(s) - aFecha(hoy())) / 864e5);
const capital = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmt = (s, o) => new Intl.DateTimeFormat('es-ES', o).format(aFecha(s));
const fechaLarga = s => {
  const o = { weekday: 'long', day: 'numeric', month: 'long' };
  if (aFecha(s).getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return fmt(s, o);
};
const fechaCorta = s => fmt(s, { day: 'numeric', month: 'short' }).replace('.', '');
const normCodigo = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const codigoBonito = c => c ? `${c.slice(0, 5)}-${c.slice(5)}` : '';
const cuenta = s => {
  const n = diasHasta(s);
  if (n === 0) return 'Es hoy';
  if (n === 1) return 'Es mañana';
  if (n > 1) return `Faltan ${n} días`;
  if (n === -1) return 'Fue ayer';
  return `Fue hace ${-n} días`;
};
const validez = v => {
  if (v.fecha_min && v.fecha_max) return `Del ${fechaCorta(v.fecha_min)} al ${fechaCorta(v.fecha_max)}`;
  if (v.fecha_min) return `Desde el ${fechaCorta(v.fecha_min)}`;
  if (v.fecha_max) return `Hasta el ${fechaCorta(v.fecha_max)}`;
  return 'Cualquier día';
};
const memoria = {};
const ls = {
  get(k) { try { const v = localStorage.getItem(k); return v !== null ? v : (memoria[k] ?? null); } catch (e) { return memoria[k] ?? null; } },
  set(k, v) { memoria[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* nada */ } },
  del(k) { delete memoria[k]; try { localStorage.removeItem(k); } catch (e) { /* nada */ } },
};
const cargarScript = src => new Promise((ok, ko) => {
  const s = document.createElement('script');
  s.src = src; s.onload = ok;
  s.onerror = () => ko(new Error('No se ha podido conectar. Revisa internet y vuelve a cargar la página.'));
  document.head.appendChild(s);
});
const ICONO_CARTERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13" rx="3"/><path d="M3 11h18"/><path d="M6.5 6.5 15 3.8a1.5 1.5 0 0 1 1.9 1.1l.4 1.6"/></svg>';

// ================================================================
//  Datos: modo prueba (solo en este navegador)
// ================================================================
function crearPrueba() {
  const CLAVE = 'planes-prueba-v1';
  const leer = () => { try { return JSON.parse(ls.get(CLAVE)) || { nombres: null, vales: [], n: 0 }; } catch (e) { return { nombres: null, vales: [], n: 0 }; } };
  const guardar = d => ls.set(CLAVE, JSON.stringify(d));
  const genCodigo = () => {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(10);
    crypto.getRandomValues(b);
    return Array.from(b, x => A[x % 32]).join('');
  };
  const publico = v => ({ codigo: v.codigo, numero: v.numero, titulo: v.titulo, detalles: v.detalles, de: v.de, para: v.para, fecha_min: v.fecha_min, fecha_max: v.fecha_max, estado: v.estado, fecha: v.fecha });
  return {
    prueba: true,
    async iniciar() {},
    nombresGuardados() { return leer().nombres; },
    guardarNombres(nombres) { const d = leer(); d.nombres = nombres; guardar(d); },
    borrarTodo() { ls.del(CLAVE); },
    async entrar() { return { nombres: leer().nombres }; },
    async listar(yo) { return leer().vales.filter(v => v.de === yo || v.estado === 'canjeado').sort((a, b) => b.creado_en.localeCompare(a.creado_en)); },
    async crear({ de, para, titulo, detalles, fecha_min, fecha_max }) {
      const d = leer();
      const v = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), numero: ++d.n, codigo: genCodigo(), titulo, detalles: detalles || '', de, para, fecha_min, fecha_max, estado: 'pendiente', fecha: null, creado_en: new Date().toISOString(), canjeado_en: null };
      d.vales.push(v); guardar(d); return v;
    },
    async borrar(id) { const d = leer(); d.vales = d.vales.filter(v => v.id !== id); guardar(d); },
    async deshacer(id) { const d = leer(); const v = d.vales.find(x => x.id === id); if (v) Object.assign(v, { estado: 'pendiente', fecha: null, canjeado_en: null }); guardar(d); return v; },
    async verVale(c) { const v = leer().vales.find(x => x.codigo === normCodigo(c)); return v ? publico(v) : null; },
    async canjear(c, fecha) {
      const d = leer(); const v = d.vales.find(x => x.codigo === normCodigo(c));
      if (!v) throw new Error('Este vale no existe o lo han borrado.');
      if (!fecha) throw new Error('Elige un día.');
      if (fecha < hoy()) throw new Error('Ese día ya ha pasado.');
      if (v.fecha_min && fecha < v.fecha_min) throw new Error('Ese día es anterior a lo permitido.');
      if (v.fecha_max && fecha > v.fecha_max) throw new Error('Ese día es posterior a lo permitido.');
      Object.assign(v, { estado: 'canjeado', fecha, canjeado_en: v.canjeado_en || new Date().toISOString() });
      guardar(d); return publico(v);
    },
  };
}

// ================================================================

function crearSupabase() {
  let sb = null;
  const traducir = m => {
    if (/failed to fetch|networkerror|load failed|network request failed/i.test(m)) return 'No hay conexión. Revisa internet y vuelve a probar.';
    if (/could not find the function|schema cache/i.test(m)) return 'Falta preparar la base de datos: ejecuta setup.sql en Supabase.';
    if (/invalid api key|no api key/i.test(m)) return 'La clave de Supabase de config.js no es válida.';
    return m;
  };
  const rpc = async (nombre, args) => {
    const { data, error } = await sb.rpc(nombre, args);
    if (error) throw new Error(traducir(error.message || String(error)));
    return data;
  };
  return {
    prueba: false,
    async iniciar() {
      await cargarScript(SUPABASE_JS);
      sb = window.supabase.createClient(CFG.supabaseUrl.trim(), CFG.supabaseKey.trim(), { auth: { persistSession: false, autoRefreshToken: false } });
    },
    entrar: clave => rpc('entrar', { p_clave: clave }),
    listar: yo => rpc('listar_vales', { p_clave: S.clave, p_yo: yo }).then(d => d || []),
    crear: d => rpc('crear_vale', { p_clave: S.clave, p_de: d.de, p_para: d.para, p_titulo: d.titulo, p_detalles: d.detalles, p_fecha_min: d.fecha_min, p_fecha_max: d.fecha_max }),
    borrar: id => rpc('borrar_vale', { p_clave: S.clave, p_id: id }),
    deshacer: id => rpc('deshacer_canje', { p_clave: S.clave, p_id: id }),
    verVale: c => rpc('ver_vale', { p_codigo: normCodigo(c) }),
    canjear: (c, fecha) => rpc('canjear_vale', { p_codigo: normCodigo(c), p_fecha: fecha }),
  };
}

async function ocupado(btn, fn) {
  if (btn) { btn.disabled = true; btn.classList.add('cargando-btn'); }
  try { return await fn(); }
  catch (e) {
    console.error(e);
    if (/clave incorrecta/i.test(e.message) && !api.prueba) { salir('La clave ha cambiado. Vuelve a escribirla.'); return undefined; }
    aviso(e.message || 'Algo ha fallado. Vuelve a probar.');
    return undefined;
  } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.classList.remove('cargando-btn'); } }
}

  const m = decodeURIComponent(location.hash.slice(1)).match(/^vale-([A-Za-z0-9-]{4,})$/);
  if (m) return normCodigo(m[1]);
  const q = new URLSearchParams(location.search).get('vale');
  return q ? normCodigo(q) : null;
}

async function mostrarApp() {
  VISTA = 'app';
  cerrarHoja();
  if (api.prueba) {
    S.nombres = api.nombresGuardados();
    if (!S.nombres) return pintarNombres();
  } else {
    if (!S.clave) return pintarClave();
    if (!S.nombres) {
      $('#app').innerHTML = '<div class="cargando">Cargando…</div>';
      try {
        const r = await api.entrar(S.clave);
        S.nombres = r.nombres; ls.set('planes-nombres', JSON.stringify(S.nombres));
      } catch (e) { return /clave/i.test(e.message) ? salir() : pintarClave(e.message); }
    }
  }
  if (!S.yo || !S.nombres.includes(S.yo)) return pintarQuien();
  if (!S.listo) { $('#app').innerHTML = '<div class="cargando">Cargando…</div>'; await recargar(); }
  if (VISTA === 'app') pintar();
}
async function recargar() {
  try { S.vales = (await api.listar(S.yo)).map(norm); S.listo = true; }
  catch (e) {
    if (/clave incorrecta/i.test(e.message) && !api.prueba) return salir('La clave ha cambiado. Vuelve a escribirla.');
    S.listo = true; aviso(e.message);
  }
}
function salir(error) {
  ls.del('planes-clave'); ls.del('planes-nombres');
  S.clave = null; S.nombres = null; S.vales = []; S.listo = false;
  cerrarHoja(); pintarClave(error);
}

function filaCanjeado(v) {
  const d = aFecha(v.fecha), pasado = diasHasta(v.fecha) < 0;
  const mes = fmt(v.fecha, { month: 'short' }).replace('.', '');
  const sem = fmt(v.fecha, { weekday: 'short' }).replace('.', '');
  return `<li class="vale canj">
    <div class="dia ${pasado ? 'pasado' : ''}" aria-hidden="true"><span class="m">${esc(mes)}</span><span class="d">${d.getDate()}</span><span class="s">${esc(sem)}</span></div>
    <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
      <h3>${esc(v.titulo)}</h3>
      <p class="meta">De ${esc(v.de)} para ${esc(v.para)} · ${capital(fechaLarga(v.fecha))}</p>
      <p class="meta" style="color:${pasado ? 'var(--gris)' : 'var(--verde-texto)'}">${cuenta(v.fecha)}</p>
      <div class="acciones">
        <button type="button" class="enlace" data-a="ics" data-id="${v.id}">Añadir al calendario</button>
        ${v.de === S.yo ? `<button type="button" class="enlace gris" data-a="deshacer" data-id="${v.id}">Deshacer canje</button>` : ''}
        <button type="button" class="enlace gris" data-a="borrar" data-id="${v.id}">Borrar</button>
      </div>
    </div>
  </li>`;
}
function tabCanjeados(c) {
  if (!c.length) return `<div class="vacio"><h2>Nada canjeado todavía</h2><p>Cuando alguien canjee un vale y elija el día, aparecerá aquí.</p></div>`;
  const prox = c.filter(v => diasHasta(v.fecha) >= 0).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const pas = c.filter(v => diasHasta(v.fecha) < 0).sort((a, b) => b.fecha.localeCompare(a.fecha));
  let html = '';
  if (prox.length) html += `<p class="subt">Próximos</p><ul class="lista">${prox.map(filaCanjeado).join('')}</ul>`;
  if (pas.length) html += `<p class="subt">Pasados</p><ul class="lista">${pas.map(filaCanjeado).join('')}</ul>`;
  return html;
}

function nuevoCal(sel, min, max) {
  const ref = aFecha(sel || min || hoy());
  return { y: ref.getFullYear(), m: ref.getMonth(), sel: sel || null, min: min || null, max: max || null };
}
function calHTML(c) {
  const primero = new Date(c.y, c.m, 1), hueco = (primero.getDay() + 6) % 7, dias = new Date(c.y, c.m + 1, 0).getDate();
  const titulo = capital(new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(primero));
  const antes = !c.min || iso(new Date(c.y, c.m, 0)) >= c.min;
  const despues = !c.max || iso(new Date(c.y, c.m + 1, 1)) <= c.max;
  const t = hoy();
  let celdas = '';
  for (let i = 0; i < hueco; i++) celdas += '<span aria-hidden="true"></span>';
  for (let d = 1; d <= dias; d++) {
    const s = iso(new Date(c.y, c.m, d));

async function fuentes() {
  if (!document.fonts || !document.fonts.load) return;
  try {
    await Promise.race([
      Promise.all(['600 100px Inter', '400 40px Inter', '400 30px "Courier Prime"'].map(f => document.fonts.load(f))),
      new Promise(ok => setTimeout(ok, 2500)),
    ]);
  } catch (e) { /* fuentes de reserva */ }
}
function lineas(g, texto, ancho, max) {
  const palabras = String(texto).split(/\s+/).filter(Boolean), out = [];
  let act = '';
  for (const p of palabras) {
    const prueba = act ? act + ' ' + p : p;
    if (g.measureText(prueba).width <= ancho || !act) act = prueba; else { out.push(act); act = p; }
  }
  if (act) out.push(act);
  const recorta = l => { let s = l; while (s.length > 1 && g.measureText(s + '…').width > ancho) s = s.slice(0, -1); return s + '…'; };
  const r = out.map(l => g.measureText(l).width <= ancho ? l : recorta(l));
  if (r.length > max) { r.length = max; r[max - 1] = recorta(r[max - 1].replace(/[\s,.;:]+$/, '')); }
  return r;
}
function rect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const espacio = (g, px) => { if ('letterSpacing' in g) g.letterSpacing = px + 'px'; };

async function imagenVale(v, url) {
  if (typeof window.qrcode !== 'function') throw new Error('No se ha podido cargar el generador de QR. Revisa la conexión.');
  await fuentes();
  const NEGRO = '#111111', GRIS = '#6f716e', VERDE = '#93bfa4', VERDE_SUAVE = '#edf4ef';
  const W = 1920, H = 1000, M = 60, TW = W - M * 2, TH = H - M * 2, SX = M + 1260;
  const F = { t: 'Inter, system-ui, sans-serif', m: '"Courier Prime", "Courier New", monospace' };
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  // Tarjeta con borde y talón verde
  g.save(); rect(g, M, M, TW, TH, 28); g.clip();
  g.fillStyle = VERDE_SUAVE; g.fillRect(SX, M, M + TW - SX, TH);
  g.restore();
  g.strokeStyle = NEGRO; g.lineWidth = 3; rect(g, M, M, TW, TH, 28); g.stroke();
  g.save(); g.strokeStyle = '#9aa39c'; g.lineWidth = 3; g.setLineDash([14, 12]);
  g.beginPath(); g.moveTo(SX, M + 30); g.lineTo(SX, M + TH - 30); g.stroke(); g.restore();

  // Parte principal
  const x0 = M + 90, x1 = SX - 80, ancho = x1 - x0;
  g.textBaseline = 'alphabetic';
  g.fillStyle = VERDE; g.beginPath(); g.arc(x0 + 9, M + 106, 9, 0, Math.PI * 2); g.fill();
  g.fillStyle = GRIS; g.font = `400 32px ${F.m}`; espacio(g, 3);
  g.fillText(`VALE Nº ${String(v.numero || 0).padStart(4, '0')}`, x0 + 34, M + 116); espacio(g, 0);

  g.fillStyle = NEGRO;
  let tam = 128, ls_;
  for (; tam >= 64; tam -= 4) {
    g.font = `600 ${tam}px ${F.t}`; espacio(g, -tam * 0.03);
    ls_ = lineas(g, v.titulo, ancho, 99);
    if (ls_.length <= (tam >= 96 ? 2 : 3)) break;
  }
  g.font = `600 ${tam}px ${F.t}`; espacio(g, -tam * 0.03);
  ls_ = lineas(g, v.titulo, ancho, 3);
  let y = M + 190 + tam * 0.82;
  for (const l of ls_) { g.fillText(l, x0, y); y += tam * 1.04; }
  espacio(g, 0);
  y = y - tam * 1.04 + tam * 0.3 + 30;
  const tope = M + TH - 200;
  if (v.detalles && y + 40 < tope) {
    g.font = `400 38px ${F.t}`; g.fillStyle = GRIS;
    for (const l of lineas(g, v.detalles, ancho, 3)) { if (y + 30 > tope) break; y += 50; g.fillText(l, x0, y); }
    g.fillStyle = NEGRO;
  }
  // Datos
  const yb = M + TH - 110;
  g.fillStyle = '#d9dcd8'; g.fillRect(x0, yb - 64, ancho, 2); g.fillStyle = NEGRO;
  let xc = x0;
  for (const [k, val] of [['DE', v.de], ['PARA', v.para], ['VÁLIDO', validez(v)]]) {
    g.font = `400 26px ${F.m}`; espacio(g, 3); g.fillStyle = GRIS; g.fillText(k, xc, yb - 18);
    espacio(g, 0); g.fillStyle = NEGRO; g.font = `500 42px ${F.t}`;
    g.fillText(String(val || '—'), xc, yb + 30);
    xc += Math.max(g.measureText(String(val || '—')).width + 70, 220);
  }

  // Talón con el QR
  const cx = SX + (M + TW - SX) / 2;
  g.textAlign = 'center'; g.fillStyle = NEGRO;
  const anchoTalon = M + TW - SX - 80;
  let tt = 30;
  do { g.font = `400 ${tt}px ${F.m}`; espacio(g, 3); tt -= 1; } while (g.measureText('ESCANÉALO Y ELIGE EL DÍA').width > anchoTalon && tt > 16);
  g.fillText('ESCANÉALO Y ELIGE EL DÍA', cx, M + 116); espacio(g, 0);
  const qs = 440, qx = cx - qs / 2, qy = M + 160;
  g.fillStyle = '#ffffff'; rect(g, qx, qy, qs, qs, 20); g.fill();
  const qr = window.qrcode(0, 'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), area = qs - 56, celda = area / n, ox = qx + 28, oy = qy + 28;
  g.fillStyle = NEGRO;
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) {
    if (!qr.isDark(r, col)) continue;
    const a = Math.round(ox + col * celda), b = Math.round(oy + r * celda);
    g.fillRect(a, b, Math.round(ox + (col + 1) * celda) - a, Math.round(oy + (r + 1) * celda) - b);
  }
  g.font = `400 46px ${F.m}`; espacio(g, 6);
  g.fillText(codigoBonito(v.codigo), cx, qy + qs + 76); espacio(g, 0);
  g.font = `400 26px ${F.m}`; g.fillStyle = GRIS;
  const host = baseWeb().replace(/^https?:\/\//, '').replace(/\/$/, '');
  g.fillText(host.length > 34 ? host.slice(0, 33) + '…' : host, cx, qy + qs + 124);
  g.textAlign = 'left';
  return await new Promise((ok, ko) => c.toBlob(b => b ? ok(b) : ko(new Error('No se ha podido crear la imagen.')), 'image/png'));
}
const nombreArchivo = (v, ext) => 'vale-' + String(v.titulo || 'plan').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) + ext;
function descargar(blob, nombre) {
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}
async function copiar(texto, input) {
  try { await navigator.clipboard.writeText(texto); aviso('Copiado'); }
  catch (e) { if (input) { input.focus(); input.select(); } aviso('Selecciona el texto y cópialo'); }
}
function ics(v) {
  const limpio = s => String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/([,;])/g, '\\$1');
  const doblar = l => { const o = []; let s = l; while (s.length > 73) { o.push(s.slice(0, 73)); s = ' ' + s.slice(73); } o.push(s); return o.join('\r\n'); };
  const sello = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const l = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Planes//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    `UID:${v.codigo}@planes`, `DTSTAMP:${sello}`, `DTSTART;VALUE=DATE:${v.fecha.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${sumarDias(v.fecha, 1).replace(/-/g, '')}`,
    `SUMMARY:${limpio(v.titulo)}`, `DESCRIPTION:${limpio([v.detalles, `Vale de ${v.de} para ${v.para}`].filter(Boolean).join('\n'))}`, 'END:VEVENT', 'END:VCALENDAR'];
