<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planes</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planes">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&display=swap">
<style>
/* Un talonario: los vales son entradas de cartulina con talón y muescas.
   Verde eucalipto = pendiente; negro = canjeado. Una columna en el móvil, dos en pantallas anchas. */
@font-face { font-family: 'Inter'; src: url('/fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Courier Prime'; src: url('/fonts/courier-prime.woff2') format('woff2'); font-weight: 400; font-display: swap; }

:root {
  --blanco: #ffffff;
  --negro: #111111;
  --texto: #222222;
  --gris: #6f716e;
  --linea: #e4e6e3;
  --fondo-2: #f5f6f5;
  --verde: #93bfa4;           /* eucalipto, el de aaronalcaide.me */
  --verde-suave: #edf4ef;
  --verde-texto: #3b6a4f;
  --f-texto: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-titulo: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-mono: 'Courier Prime', 'Courier New', ui-monospace, monospace;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; background: var(--blanco); }
body {
  min-height: 100vh; background: var(--blanco); color: var(--negro);
  font: 400 16px/1.5 var(--f-texto); font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
}
body.lock { overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--negro); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- Cabecera ---------- */
.aviso-prueba {
  background: var(--verde-suave); color: var(--verde-texto); font-size: 13px; line-height: 1.4; text-align: center;
  padding-block: 8px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 26px 20px; }
.marca { font-size: 40px; font-weight: 500; letter-spacing: -0.055em; line-height: 1; color: var(--negro); text-decoration: none; }
.marca .dot { color: var(--verde); }
.quien {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px;
  border: 1px solid var(--linea); border-radius: 999px; font-size: 14px; font-weight: 500;
}
.quien::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--verde); }

.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: var(--fondo-2); width: max-content; max-width: 100%; }
.tabs button { padding: 8px 16px; border-radius: 9px; font-size: 15px; font-weight: 550; color: var(--gris); white-space: nowrap; }
.tabs button[aria-current="page"] { background: var(--blanco); color: var(--negro); box-shadow: 0 1px 2px rgba(17, 17, 17, .08), 0 4px 10px -6px rgba(17, 17, 17, .25); }
.tabs .n { margin-left: 6px; font-size: 12px; color: var(--gris); font-variant-numeric: tabular-nums; }

main.wrap { padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
.barra { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; padding: 22px 0 18px; }

/* ---------- Botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent;
  font-size: 15px; font-weight: 600; line-height: 1.2; text-align: center; text-decoration: none;
  transition: background-color .15s ease, transform .1s ease;
}
.btn:active:not([disabled]) { transform: scale(.98); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-negro { background: var(--negro); color: var(--blanco); }
.btn-borde { background: var(--blanco); color: var(--negro); border-color: var(--negro); }
.btn-suave { background: var(--fondo-2); color: var(--negro); }
.btn-ancho { width: 100%; }
.btn-peq { min-height: 36px; padding: 0 14px; font-size: 14px; border-radius: 8px; }
.btn svg { width: 18px; height: 18px; flex: none; }
@media (hover: hover) {
  .btn-negro:hover:not([disabled]) { background: #2b2b2b; }
  .btn-borde:hover:not([disabled]), .btn-suave:hover:not([disabled]) { background: var(--verde-suave); }
}
.enlace { font-size: 14px; color: inherit; border-bottom: 1px solid currentColor; padding: 2px 0; line-height: 1.3; opacity: .8; }
@media (hover: hover) { .enlace:hover { opacity: 1; } }
.cargando-btn { position: relative; color: transparent !important; pointer-events: none; }
.cargando-btn::after {
  content: ""; position: absolute; left: calc(50% - 8px); top: calc(50% - 8px); width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--blanco); border-right-color: transparent; animation: gira .7s linear infinite;
}
.btn-borde.cargando-btn::after, .btn-suave.cargando-btn::after { border-color: var(--negro); border-right-color: transparent; }
@keyframes gira { to { transform: rotate(360deg); } }

/* ---------- Entradas (tickets) de la lista ---------- */
.talonario { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.tk {
  --carton: var(--verde); --tinta: var(--negro); --corte: rgba(17, 17, 17, .32);
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 82px;
  background: var(--carton); color: var(--tinta); border-radius: 14px; min-width: 0;
  animation: entra .35s cubic-bezier(.2, .8, .2, 1) both;
}
.tk.usado { --carton: var(--negro); --tinta: var(--blanco); --corte: rgba(255, 255, 255, .28); }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } }
.tk-main { padding: 18px 14px 16px 20px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.tk-meta { font: 400 12px/1.35 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; opacity: .72; }
.tk-titulo { font: 800 31px/.94 var(--f-titulo); text-transform: uppercase; letter-spacing: .004em; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.tk-det { font-size: 14px; line-height: 1.4; opacity: .82; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tk-cuenta { font: 400 12px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--verde); }
.tk-acc { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 8px; }
.tk .btn-negro { background: var(--negro); color: var(--blanco); }
.tk.usado .btn-negro { background: var(--blanco); color: var(--negro); }
.tk-talon {
  position: relative; border-left: 2px dashed var(--corte);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 16px 4px;
}
.tk-talon::before, .tk-talon::after {
  content: ""; position: absolute; left: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--blanco);
}
.tk-talon::before { top: -11px; } .tk-talon::after { bottom: -11px; }
.tk-num { font: 400 12px/1 var(--f-mono); letter-spacing: .14em; writing-mode: vertical-rl; transform: rotate(180deg); opacity: .75; white-space: nowrap; }
.tk-dia .m { font: 400 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.tk-dia .d { font: 800 44px/1 var(--f-titulo); }
.tk-dia .s { font: 400 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.tk-dia { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tk.usado.pasado { --carton: #3a3c3a; }

.subt { font: 400 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gris); padding: 26px 0 14px; }
.subt:first-child { padding-top: 22px; }
.vacio {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 82px;
  border: 2px dashed var(--linea); border-radius: 14px; color: var(--gris);
}
.vacio > div:first-child { padding: 22px 18px 22px 20px; display: flex; flex-direction: column; gap: 6px; }
.vacio h2 { font: 800 26px/1 var(--f-titulo); text-transform: uppercase; color: var(--negro); }
.vacio p { font-size: 15px; max-width: 40ch; }
.vacio > div:last-child { border-left: 2px dashed var(--linea); }
.codigo-caja { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--linea); max-width: 480px; }
.codigo-caja label { display: block; font-size: 14px; color: var(--gris); margin-bottom: 8px; }
.fila { display: flex; gap: 8px; }
.fila input { flex: 1; min-width: 0; }

/* ---------- Formularios ---------- */
.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo > span { font-size: 14px; font-weight: 550; }
.campo em { font-style: normal; font-weight: 400; color: var(--gris); }
input[type="text"], input[type="password"], input[type="date"], input:not([type]), textarea {
  width: 100%; min-width: 0; font-size: 16px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid #d3d7d2; background: var(--blanco); color: var(--negro);
}
input[type="date"] { min-height: 48px; -webkit-appearance: none; appearance: none; }
input:focus, textarea:focus { outline: none; border-color: var(--negro); }
input::placeholder, textarea::placeholder { color: #9a9d99; }
textarea { resize: vertical; line-height: 1.45; }
.codigo-in { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--negro); }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.error { font-size: 14px; font-weight: 550; color: var(--negro); background: var(--fondo-2); border-left: 3px solid var(--negro); padding: 8px 12px; border-radius: 4px; }
.para-l { font: 400 13px/1.3 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--gris); }
.para-l strong { color: var(--negro); font-weight: 400; }
.segmento { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: var(--fondo-2); }
.segmento label { position: relative; }
.segmento input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.segmento span { display: flex; align-items: center; justify-content: center; min-height: 42px; border-radius: 9px; font-weight: 600; color: var(--gris); }
.segmento input:checked + span { background: var(--blanco); color: var(--negro); box-shadow: 0 1px 2px rgba(17, 17, 17, .08), 0 4px 10px -6px rgba(17, 17, 17, .25); }
.segmento input:focus-visible + span { outline: 2px solid var(--negro); outline-offset: 2px; }

/* ---------- Entrar ---------- */
.entrar { position: relative; min-height: calc(100vh - env(safe-area-inset-top, 0px)); display: grid; place-items: center; overflow: hidden; padding-block: 40px; }
.entrar-caja { position: relative; z-index: 1; width: min(380px, 100%); display: flex; flex-direction: column; gap: 16px; background: var(--blanco); padding: 4px 0; }
.entrar .marca { font-size: 60px; margin-bottom: 8px; }
.entrar form { display: flex; flex-direction: column; gap: 14px; }
.entrar .otra { font-size: 14px; color: var(--gris); margin-top: 18px; }
.deco { position: absolute; width: 280px; height: 128px; border-radius: 14px; pointer-events: none; }
.deco::after { content: ""; position: absolute; top: 14px; bottom: 14px; right: 74px; border-left: 2px dashed rgba(17, 17, 17, .25); }
.deco.n::after { border-color: rgba(255, 255, 255, .25); }
.deco.v { background: var(--verde); }
.deco.n { background: var(--negro); }
.deco-1 { top: 5%; left: -120px; transform: rotate(-13deg); }
.deco-2 { bottom: 6%; right: -110px; transform: rotate(10deg); }
@media (max-width: 520px) { .deco-1 { top: -46px; left: -150px; } .deco-2 { bottom: -60px; right: -160px; } }

/* ---------- Hojas ---------- */
#hoja { position: fixed; inset: 0; z-index: 50; }
.hoja-fondo { position: absolute; inset: 0; background: rgba(17, 17, 17, .45); opacity: 0; transition: opacity .2s; }
.hoja {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh;
  display: flex; flex-direction: column; background: var(--blanco); border-radius: 18px 18px 0 0;
  transform: translateY(102%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px); outline: none;
}
#hoja.on .hoja-fondo { opacity: 1; }
#hoja.on .hoja { transform: none; }
.hoja-cab {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px max(20px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px));
}
.hoja-cab h2 { font: 800 26px/1 var(--f-titulo); text-transform: uppercase; }
.cerrar { width: 36px; height: 36px; border-radius: 50%; background: var(--fondo-2); font-size: 22px; line-height: 1; flex: none; }
.hoja-cuerpo {
  overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px;
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) 18px max(20px, env(safe-area-inset-left, 0px));
}
.hoja-pie {
  display: flex; flex-wrap: wrap; gap: 10px; border-top: 1px solid var(--linea);
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) 14px max(20px, env(safe-area-inset-left, 0px));
}
.hoja-pie .btn { flex: 1 1 auto; }
@media (min-width: 640px) {
  .hoja {
    left: 50%; top: 50%; bottom: auto; width: min(580px, calc(100% - 40px)); max-height: min(88vh, 880px);
    border-radius: 16px; transform: translate(-50%, -47%); opacity: 0; transition: transform .2s ease, opacity .2s ease;
    box-shadow: 0 30px 60px -24px rgba(17, 17, 17, .5);
  }
  #hoja.on .hoja { transform: translate(-50%, -50%); opacity: 1; }
  .hoja-pie { justify-content: flex-end; }
  .hoja-pie .btn { flex: 0 0 auto; }
}
.imagen-vale img { display: block; width: 100%; height: auto; border-radius: 10px; }
.esperando { aspect-ratio: 1920 / 1040; border-radius: 10px; background: var(--verde-suave); }
.enlace-fila { display: flex; gap: 8px; }
.enlace-fila input { flex: 1; min-width: 0; font: 400 14px/1.2 var(--f-mono) !important; padding: 10px 12px !important; color: var(--gris) !important; }
.cartera-fila { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; padding: 14px; border-radius: 10px; background: var(--fondo-2); }
.cartera-fila > div { flex: 1 1 220px; min-width: 0; font-size: 14px; }
.cartera-fila strong { display: block; font-weight: 600; }
.cartera-fila span { color: var(--gris); }

/* ---------- Página del vale (al escanear el QR) ---------- */
.v-cab { padding-block: 26px 18px; }
.v-de { font: 400 13px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--gris); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.v-de::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--verde); }
.tkb {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr);
  background: var(--verde); color: var(--negro); border-radius: 18px;
  box-shadow: 0 26px 50px -30px rgba(17, 17, 17, .55);
  animation: aparece .6s cubic-bezier(.2, .8, .2, 1) both;
}
.tkb.usado { background: var(--negro); color: var(--blanco); }
@keyframes aparece { from { opacity: 0; transform: translateY(16px) rotate(-1.2deg); } }
.tkb-main { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tkb-num { font: 400 13px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; opacity: .72; }
.tkb-titulo { font: 800 clamp(44px, 12vw, 64px)/.92 var(--f-titulo); text-transform: uppercase; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.tkb-det { font-size: 16px; line-height: 1.45; opacity: .85; overflow-wrap: anywhere; }
.tkb-datos { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 4px; padding-top: 14px; border-top: 1.5px solid rgba(17, 17, 17, .22); }
.tkb.usado .tkb-datos { border-top-color: rgba(255, 255, 255, .2); }
.tkb-datos dt { font: 400 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: 6px; }
.tkb-datos dd { font: 700 24px/1 var(--f-titulo); text-transform: uppercase; }
.tkb-talon {
  position: relative; border-top: 2px dashed rgba(17, 17, 17, .32);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px 16px;
}
.tkb.usado .tkb-talon { border-color: rgba(255, 255, 255, .28); }
.tkb-talon::before, .tkb-talon::after { content: ""; position: absolute; top: -12px; width: 24px; height: 24px; border-radius: 50%; background: var(--blanco); }
.tkb-talon::before { left: -12px; } .tkb-talon::after { right: -12px; }
.tkb-talon .eti { font: 400 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; opacity: .65; }
.tkb-talon .cod { font: 400 17px/1.2 var(--f-mono); letter-spacing: .1em; }
.sello {
  position: absolute; z-index: 2; right: 16px; top: 16px; pointer-events: none;
  border: 3px solid currentColor; border-radius: 10px; padding: 7px 13px 6px; text-align: center;
  font: 800 26px/1 var(--f-titulo); text-transform: uppercase; letter-spacing: .08em;
  transform: rotate(-9deg); color: var(--verde); opacity: .95;
}
.sello small { display: block; font: 400 12px/1.2 var(--f-mono); letter-spacing: .14em; margin-top: 4px; }
.sello.anim { animation: sello .5s cubic-bezier(.3, 1.5, .5, 1) .15s both; }
@keyframes sello { from { opacity: 0; transform: rotate(-9deg) scale(2.4); } to { opacity: .95; transform: rotate(-9deg) scale(1); } }
@media (min-width: 640px) {
  .tkb { grid-template-columns: minmax(0, 1fr) 190px; }
  .tkb-main { padding: 30px 30px 26px; }
  .tkb-talon { border-top: 0; border-left: 2px dashed rgba(17, 17, 17, .32); flex-direction: column; justify-content: center; text-align: center; gap: 22px; padding: 24px 16px; }
  .tkb-talon::before { top: -12px; left: -13px; } .tkb-talon::after { top: auto; bottom: -12px; right: auto; left: -13px; }
  .sello { right: 214px; top: 26px; }
}
.talon-bloque { display: flex; flex-direction: column; gap: 6px; }
.bloque-v { padding: 30px 0 0; display: flex; flex-direction: column; gap: 14px; max-width: 520px; }
.bloque-v h2 { font: 800 30px/1 var(--f-titulo); text-transform: uppercase; }
.botones-v { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 640px) { .botones-v { flex-direction: row; flex-wrap: wrap; } }
.fecha-v { font: 800 clamp(34px, 9vw, 46px)/1 var(--f-titulo); text-transform: uppercase; }
.cuenta-v { font: 400 13px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--verde-texto); }
.pie-v { padding: 34px 0 calc(40px + env(safe-area-inset-bottom, 0px)); }
.pie-v .enlace { color: var(--gris); }

.cal { border: 1px solid var(--linea); border-radius: 14px; padding: 12px 10px 10px; }
.cal-cab { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 6px; }
.cal-cab strong { font: 700 22px/1 var(--f-titulo); text-transform: uppercase; letter-spacing: .02em; }
.cal-nav { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--negro); }
.cal-nav[disabled] { opacity: .25; cursor: default; }
@media (hover: hover) { .cal-nav:not([disabled]):hover { background: var(--fondo-2); } }
.cal-sem, .cal-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center; }
.cal-sem span { font: 400 12px/2.2 var(--f-mono); color: var(--gris); }
.cal-d { height: clamp(40px, 11vw, 46px); border-radius: 10px; font-size: 15px; font-weight: 550; font-variant-numeric: tabular-nums; color: var(--negro); }
.cal-d.hoy { box-shadow: inset 0 0 0 1px var(--linea); }
.cal-d.sel { background: var(--negro); color: var(--blanco); box-shadow: none; }
.cal-d[disabled] { color: #c3c6c2; cursor: default; }
@media (hover: hover) { .cal-d:not([disabled]):not(.sel):hover { background: var(--verde-suave); } }

/* ---------- Varios ---------- */
#aviso {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  background: var(--negro); color: var(--blanco); padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 550;
  width: max-content; max-width: calc(100% - 40px); text-align: center;
}
#aviso.on { opacity: 1; transform: translate(-50%, 0); }
.cargando { min-height: 50vh; display: grid; place-items: center; color: var(--gris); font-size: 14px; }
#imprimir { display: none; }
@media print {
  @page { margin: 12mm; }
  body { padding: 0; }
  body > *:not(#imprimir) { display: none !important; }
  #imprimir { display: block !important; }
  #imprimir img { width: 100%; height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-delay: 0s !important; }
}
</style>
</head>
<body>
<div id="app"><div class="cargando">Cargando…</div></div>
<div id="hoja" hidden></div>
<div id="aviso" role="status" aria-live="polite"></div>
<div id="imprimir" aria-hidden="true"></div>
<noscript><p style="padding:24px">Esta página necesita JavaScript.</p></noscript>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(() => {
'use strict';

// ================================================================
//  Configuración
// ================================================================
const CFG = Object.assign({ personas: ['Aaron', 'Lizz'], supabaseUrl: '', supabaseKey: '', clavePrueba: '', wallet: false }, window.PLANES_CONFIG || {});
const PRUEBA = !(CFG.supabaseUrl && CFG.supabaseKey);
const CARTERA = !PRUEBA && CFG.wallet === true;
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';

// ================================================================
//  Utilidades
// ================================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => iso(new Date());
const aFecha = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const sumarDias = (s, n) => { const d = aFecha(s); d.setDate(d.getDate() + n); return iso(d); };
const diasHasta = s => Math.round((aFecha(s) - aFecha(hoy())) / 864e5);
const capital = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const fmt = (s, o) => new Intl.DateTimeFormat('es-ES', o).format(aFecha(s));
const fechaLarga = s => {
  const o = { weekday: 'long', day: 'numeric', month: 'long' };
  if (aFecha(s).getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return fmt(s, o);
};
const fechaCorta = s => fmt(s, { day: 'numeric', month: 'short' }).replace('.', '');
const fechaSello = s => { const d = aFecha(s); return `${pad(d.getDate())}·${pad(d.getMonth() + 1)}·${String(d.getFullYear()).slice(2)}`; };
const numero = n => 'Nº ' + String(n || 0).padStart(4, '0');
const normCodigo = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const codigoBonito = c => c ? `${c.slice(0, 5)}-${c.slice(5)}` : '';
const cuenta = s => {
  const n = diasHasta(s);
  if (n === 0) return 'Es hoy';
  if (n === 1) return 'Es mañana';
  if (n > 1) return `Faltan ${n} días`;
  if (n === -1) return 'Fue ayer';
  return `Fue hace ${-n} días`;
};
const validez = v => {
  if (v.fecha_min && v.fecha_max) return `${fechaCorta(v.fecha_min)} – ${fechaCorta(v.fecha_max)}`;
  if (v.fecha_min) return `Desde el ${fechaCorta(v.fecha_min)}`;
  if (v.fecha_max) return `Hasta el ${fechaCorta(v.fecha_max)}`;
  return 'Cualquier día';
};
const memoria = {};
const ls = {
  get(k) { try { const v = localStorage.getItem(k); return v !== null ? v : (memoria[k] ?? null); } catch (e) { return memoria[k] ?? null; } },
  set(k, v) { memoria[k] = v; try { localStorage.setItem(k, v); } catch (e) { /* nada */ } },
  del(k) { delete memoria[k]; try { localStorage.removeItem(k); } catch (e) { /* nada */ } },
};
const cargarScript = src => new Promise((ok, ko) => {
  const s = document.createElement('script');
  s.src = src; s.onload = ok;
  s.onerror = () => ko(new Error('No se ha podido conectar. Revisa internet y vuelve a cargar la página.'));
  document.head.appendChild(s);
});
async function huella(texto) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join('');
}
const ICONO_CARTERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.5" width="18" height="13" rx="3"/><path d="M3 11h18"/><path d="M6.5 6.5 15 3.8a1.5 1.5 0 0 1 1.9 1.1l.4 1.6"/></svg>';

// ================================================================
//  Datos: modo prueba (solo en este navegador)
// ================================================================
function crearPrueba() {
  const CLAVE = 'planes-prueba-v2';
  const leer = () => { try { return JSON.parse(ls.get(CLAVE)) || { vales: [], n: 0 }; } catch (e) { return { vales: [], n: 0 }; } };
  const guardar = d => ls.set(CLAVE, JSON.stringify(d));
  const genCodigo = () => {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(10);
    crypto.getRandomValues(b);
    return Array.from(b, x => A[x % 32]).join('');
  };
  const publico = v => ({ codigo: v.codigo, numero: v.numero, titulo: v.titulo, detalles: v.detalles, de: v.de, para: v.para, fecha_min: v.fecha_min, fecha_max: v.fecha_max, estado: v.estado, fecha: v.fecha });
  const comprobar = async (nombre, clave) => {
    if (!CFG.personas.includes(nombre) || !CFG.clavePrueba || (await huella(clave || '')) !== CFG.clavePrueba) throw new Error('Contraseña incorrecta.');
  };
  return {
    prueba: true,
    async iniciar() {},
    borrarTodo() { ls.del(CLAVE); },
    async entrar(nombre, clave) { await comprobar(nombre, clave); return { nombre, otro: CFG.personas.find(p => p !== nombre) }; },
    async listar() { return leer().vales.filter(v => v.de === S.yo || v.estado === 'canjeado').sort((a, b) => b.creado_en.localeCompare(a.creado_en)); },
    async crear({ titulo, detalles, fecha_min, fecha_max }) {
      const d = leer();
      const v = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), numero: ++d.n, codigo: genCodigo(), titulo, detalles: detalles || '', de: S.yo, para: otro(), fecha_min, fecha_max, estado: 'pendiente', fecha: null, creado_en: new Date().toISOString(), canjeado_en: null };
      d.vales.push(v); guardar(d); return v;
    },
    async borrar(id) { const d = leer(); d.vales = d.vales.filter(v => v.id !== id); guardar(d); },
    async deshacer(id) { const d = leer(); const v = d.vales.find(x => x.id === id); if (v) Object.assign(v, { estado: 'pendiente', fecha: null, canjeado_en: null }); guardar(d); return v; },
    async verVale(c) { const v = leer().vales.find(x => x.codigo === normCodigo(c)); return v ? publico(v) : null; },
    async canjear(c, fecha) {
      const d = leer(); const v = d.vales.find(x => x.codigo === normCodigo(c));
      if (!v) throw new Error('Este vale no existe o lo han borrado.');
      if (!fecha) throw new Error('Elige un día.');
      if (fecha < hoy()) throw new Error('Ese día ya ha pasado.');
      if (v.fecha_min && fecha < v.fecha_min) throw new Error('Ese día es anterior a lo permitido.');
      if (v.fecha_max && fecha > v.fecha_max) throw new Error('Ese día es posterior a lo permitido.');
      Object.assign(v, { estado: 'canjeado', fecha, canjeado_en: v.canjeado_en || new Date().toISOString() });
      guardar(d); return publico(v);
    },
  };
}

// ================================================================
//  Datos: Supabase (compartido entre los dos)
// ================================================================
function crearSupabase() {
  let sb = null;
  const traducir = m => {
    if (/failed to fetch|networkerror|load failed|network request failed/i.test(m)) return 'No hay conexión. Revisa internet y vuelve a probar.';
    if (/could not find the function|schema cache/i.test(m)) return 'Falta preparar la base de datos: ejecuta setup.sql en Supabase.';
    if (/invalid api key|no api key/i.test(m)) return 'La clave de Supabase de config.js no es válida.';
    return m;
  };
  const rpc = async (nombre, args) => {
    const { data, error } = await sb.rpc(nombre, args);
    if (error) throw new Error(traducir(error.message || String(error)));
    return data;
  };
  return {
    prueba: false,
    async iniciar() {
      await cargarScript(SUPABASE_JS);
      sb = window.supabase.createClient(CFG.supabaseUrl.trim(), CFG.supabaseKey.trim(), { auth: { persistSession: false, autoRefreshToken: false } });
    },
    entrar: (nombre, clave) => rpc('entrar', { p_nombre: nombre, p_clave: clave }),
    listar: () => rpc('listar_vales', { p_nombre: S.yo, p_clave: S.clave }).then(d => d || []),
    crear: d => rpc('crear_vale', { p_nombre: S.yo, p_clave: S.clave, p_titulo: d.titulo, p_detalles: d.detalles, p_fecha_min: d.fecha_min, p_fecha_max: d.fecha_max }),
    borrar: id => rpc('borrar_vale', { p_nombre: S.yo, p_clave: S.clave, p_id: id }),
    deshacer: id => rpc('deshacer_canje', { p_nombre: S.yo, p_clave: S.clave, p_id: id }),
    verVale: c => rpc('ver_vale', { p_codigo: normCodigo(c) }),
    canjear: (c, fecha) => rpc('canjear_vale', { p_codigo: normCodigo(c), p_fecha: fecha }),
    paseWallet: c => rpc('pase_wallet', { p_codigo: normCodigo(c), p_web: baseWeb() }),
  };
}

// ================================================================
//  Estado
// ================================================================
const api = PRUEBA ? crearPrueba() : crearSupabase();
const S = {
  yo: CFG.personas.includes(ls.get('planes-yo')) ? ls.get('planes-yo') : null,
  clave: ls.get('planes-clave'),
  vales: [],
  tab: ls.get('planes-tab') === 'canjeados' ? 'canjeados' : 'mios',
  listo: false,
};
let VISTA = '', V = null, HOJA = null, CAL = null;

const otro = () => CFG.personas.find(n => n !== S.yo) || '';
const vale = id => S.vales.find(v => v.id === id);
const norm = v => Object.assign(v, {
  fecha: v.fecha ? String(v.fecha).slice(0, 10) : null,
  fecha_min: v.fecha_min ? String(v.fecha_min).slice(0, 10) : null,
  fecha_max: v.fecha_max ? String(v.fecha_max).slice(0, 10) : null,
});
const mios = () => S.vales.filter(v => v.estado === 'pendiente' && v.de === S.yo);
const canjeados = () => S.vales.filter(v => v.estado === 'canjeado' && v.fecha);

function aviso(msg) {
  const t = $('#aviso'); t.textContent = msg; t.classList.add('on');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => t.classList.remove('on'), 2600);
}
async function ocupado(btn, fn) {
  if (btn) { btn.disabled = true; btn.classList.add('cargando-btn'); }
  try { return await fn(); }
  catch (e) {
    console.error(e);
    if (/contraseña incorrecta/i.test(e.message) && VISTA === 'app') { salir('La contraseña ha cambiado. Vuelve a entrar.'); return undefined; }
    aviso(e.message || 'Algo ha fallado. Vuelve a probar.');
    return undefined;
  } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.classList.remove('cargando-btn'); } }
}

// ================================================================
//  Rutas: el QR abre /planes/#vale-CODIGO
// ================================================================
function codigoURL() {
  const m = decodeURIComponent(location.hash.slice(1)).match(/^vale-([A-Za-z0-9-]{4,})$/);
  if (m) return normCodigo(m[1]);
  const q = new URLSearchParams(location.search).get('vale');
  return q ? normCodigo(q) : null;
}
const baseWeb = () => (location.origin + location.pathname).replace(/index\.html$/, '');
const urlVale = c => `${baseWeb()}#vale-${c}`;
function irAlVale(c) { cerrarHoja(); if (location.hash === '#vale-' + c) enrutar(); else location.hash = 'vale-' + c; }
function irALaLista() {
  try { history.replaceState(null, '', location.pathname); } catch (e) { location.hash = ''; }
  V = null; enrutar();
}
function enrutar() { const c = codigoURL(); if (c) mostrarVale(c); else mostrarApp(); }
addEventListener('hashchange', enrutar);

// ================================================================
//  Entrar
// ================================================================
const marca = () => `<a class="marca" href="./" data-a="lista">Planes<span class="dot">.</span></a>`;
const avisoPrueba = () => api.prueba ? '<div class="aviso-prueba">Modo prueba: sin base de datos, los vales solo se guardan en este navegador.</div>' : '';

function pintarEntrar(error, nombre) {
  VISTA = 'entrar';
  const sel = nombre || S.yo || CFG.personas[0];
  $('#app').innerHTML = `${avisoPrueba()}<div class="wrap entrar">
    <div class="deco v deco-1" aria-hidden="true"></div><div class="deco n deco-2" aria-hidden="true"></div>
    <div class="entrar-caja">
      ${marca()}
      <form data-form="entrar" novalidate>
        <div class="segmento" role="radiogroup" aria-label="¿Quién eres?">${CFG.personas.map(p => `<label><input type="radio" name="yo" value="${esc(p)}" ${p === sel ? 'checked' : ''}><span>${esc(p)}</span></label>`).join('')}</div>
        <label class="campo"><span class="sr">Contraseña</span><input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" inputmode="numeric"></label>
        ${error ? `<p class="error">${esc(error)}</p>` : ''}
        <button class="btn btn-negro btn-ancho" type="submit">Entrar</button>
      </form>
      <form data-form="codigo" class="otra" novalidate>
        <label class="campo"><span style="font-weight:400">¿Tienes el código de un vale?</span>
          <span class="fila"><input class="codigo-in" placeholder="ABCDE-12345" autocomplete="off" autocapitalize="characters" aria-label="Código del vale"><button class="btn btn-borde" type="submit">Abrir</button></span></label>
      </form>
    </div>
  </div>`;
}
function salir(error) {
  ls.del('planes-clave'); S.clave = null; S.vales = []; S.listo = false;
  cerrarHoja(); pintarEntrar(error);
}

// ================================================================
//  Lista
// ================================================================
async function mostrarApp() {
  VISTA = 'app'; cerrarHoja();
  if (!S.yo || !S.clave) return pintarEntrar();
  if (!S.listo) { $('#app').innerHTML = '<div class="cargando">Cargando…</div>'; await recargar(); }
  if (VISTA === 'app' && S.clave) pintar();
}
async function recargar() {
  try { S.vales = (await api.listar()).map(norm); S.listo = true; }
  catch (e) {
    if (/contraseña incorrecta/i.test(e.message)) return salir('La contraseña ha cambiado. Vuelve a entrar.');
    S.listo = true; aviso(e.message);
  }
}

function pintar() {
  const m = mios(), c = canjeados();
  $('#app').innerHTML = `${avisoPrueba()}
    <header class="wrap cab">${marca()}<button type="button" class="quien" data-a="cuenta" aria-label="Cuenta de ${esc(S.yo)}">${esc(S.yo)}</button></header>
    <main class="wrap">
      <div class="barra">
        <nav class="tabs" aria-label="Secciones">
          <button type="button" data-a="tab" data-t="mios" ${S.tab === 'mios' ? 'aria-current="page"' : ''}>Mis vales<span class="n">${m.length || ''}</span></button>
          <button type="button" data-a="tab" data-t="canjeados" ${S.tab === 'canjeados' ? 'aria-current="page"' : ''}>Canjeados<span class="n">${c.length || ''}</span></button>
        </nav>
        ${S.tab === 'mios' ? '<button type="button" class="btn btn-negro" data-a="nuevo">Nuevo vale</button>' : ''}
      </div>
      ${S.tab === 'mios' ? tabMios(m) : tabCanjeados(c)}
    </main>`;
}

function tkPendiente(v) {
  return `<li class="tk">
    <div class="tk-main">
      <p class="tk-meta">Para ${esc(v.para)} · ${esc(validez(v))}</p>
      <h3 class="tk-titulo">${esc(v.titulo)}</h3>
      ${v.detalles ? `<p class="tk-det">${esc(v.detalles)}</p>` : ''}
      <div class="tk-acc"><button type="button" class="btn btn-negro btn-peq" data-a="qr" data-id="${v.id}">Ver QR</button><button type="button" class="enlace" data-a="borrar" data-id="${v.id}">Borrar</button></div>
    </div>
    <div class="tk-talon"><span class="tk-num">VALE ${numero(v.numero).toUpperCase()}</span></div>
  </li>`;
}
function tkCanjeado(v) {
  const pasado = diasHasta(v.fecha) < 0;
  return `<li class="tk usado ${pasado ? 'pasado' : ''}">
    <div class="tk-main">
      <p class="tk-meta">De ${esc(v.de)} para ${esc(v.para)}</p>
      <h3 class="tk-titulo">${esc(v.titulo)}</h3>
      <p class="tk-cuenta">${capital(fechaLarga(v.fecha))} · ${cuenta(v.fecha)}</p>
      <div class="tk-acc">
        <button type="button" class="enlace" data-a="ics" data-id="${v.id}">Calendario</button>
        ${v.de === S.yo ? `<button type="button" class="enlace" data-a="deshacer" data-id="${v.id}">Deshacer canje</button>` : ''}
        <button type="button" class="enlace" data-a="borrar" data-id="${v.id}">Borrar</button>
      </div>
    </div>
    <div class="tk-talon"><div class="tk-dia" aria-hidden="true"><span class="m">${esc(fmt(v.fecha, { month: 'short' }).replace('.', ''))}</span><span class="d">${aFecha(v.fecha).getDate()}</span><span class="s">${esc(fmt(v.fecha, { weekday: 'short' }).replace('.', ''))}</span></div></div>
  </li>`;
}
function vacio(titulo, texto) {
  return `<div class="vacio"><div><h2>${titulo}</h2><p>${texto}</p></div><div></div></div>`;
}
function tabMios(m) {
  let html = m.length ? `<ul class="talonario">${m.map(tkPendiente).join('')}</ul>`
    : vacio('Sin vales pendientes', 'Crea uno y pásale el QR. Elegirá el día al escanearlo.');
  html += `<form class="codigo-caja" data-form="codigo" novalidate><label for="cod">¿Te han dado un vale? Escribe su código</label>
    <div class="fila"><input id="cod" class="codigo-in" placeholder="ABCDE-12345" autocomplete="off" autocapitalize="characters"><button class="btn btn-borde" type="submit">Abrir</button></div></form>`;
  return html;
}
function tabCanjeados(c) {
  if (!c.length) return vacio('Nada canjeado', 'Cuando se canjee un vale, aparecerá aquí con su día.');
  const prox = c.filter(v => diasHasta(v.fecha) >= 0).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const pas = c.filter(v => diasHasta(v.fecha) < 0).sort((a, b) => b.fecha.localeCompare(a.fecha));
  let html = '';
  if (prox.length) html += `<p class="subt">Próximos</p><ul class="talonario">${prox.map(tkCanjeado).join('')}</ul>`;
  if (pas.length) html += `<p class="subt">Pasados</p><ul class="talonario">${pas.map(tkCanjeado).join('')}</ul>`;
  return html;
}

// ================================================================
//  Hojas
// ================================================================
let focoAntes = null;
function abrirHoja(titulo, cuerpo, pie = '') {
  const h = $('#hoja');
  focoAntes = document.activeElement;
  h.innerHTML = `<div class="hoja-fondo" data-a="cerrar"></div>
    <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-t" tabindex="-1">
      <div class="hoja-cab"><h2 id="hoja-t">${titulo}</h2><button type="button" class="cerrar" data-a="cerrar" aria-label="Cerrar">×</button></div>
      ${cuerpo}${pie ? `<div class="hoja-pie">${pie}</div>` : ''}
    </div>`;
  h.hidden = false; document.body.classList.add('lock');
  requestAnimationFrame(() => requestAnimationFrame(() => { h.classList.add('on'); $('.hoja', h).focus({ preventScroll: true }); }));
}
function cerrarHoja() {
  const h = $('#hoja');
  if (h.hidden) return;
  h.classList.remove('on'); document.body.classList.remove('lock');
  HOJA = null;
  setTimeout(() => { if (!h.classList.contains('on')) { h.hidden = true; h.innerHTML = ''; } }, 250);
  if (focoAntes && focoAntes.isConnected) try { focoAntes.focus({ preventScroll: true }); } catch (e) { /* nada */ }
}
function abrirNuevo() {
  HOJA = { tipo: 'nuevo' };
  abrirHoja('Nuevo vale', `<form class="hoja-cuerpo" id="f-nuevo" data-form="nuevo" novalidate>
      <p class="para-l">Para <strong>${esc(otro())}</strong></p>
      <label class="campo"><span>Qué es</span><input id="nv-titulo" maxlength="120" placeholder="Entradas para el Oceanogràfic" autocomplete="off"></label>
      <label class="campo"><span>Detalles <em>(opcional)</em></span><textarea id="nv-det" rows="3" maxlength="500"></textarea></label>
      <label class="check"><input type="checkbox" id="nv-limitar"> Limitar las fechas</label>
      <div class="dos" id="nv-fechas" hidden>

function nuevoCal(sel, min, max) {
  const ref = aFecha(sel || min || hoy());
  return { y: ref.getFullYear(), m: ref.getMonth(), sel: sel || null, min: min || null, max: max || null };
}
function calHTML(c) {
  const primero = new Date(c.y, c.m, 1), hueco = (primero.getDay() + 6) % 7, dias = new Date(c.y, c.m + 1, 0).getDate();
  const titulo = capital(new Intl.DateTimeFormat('es-ES', { month: 'long', year: 'numeric' }).format(primero));
  const antes = !c.min || iso(new Date(c.y, c.m, 0)) >= c.min;
  const despues = !c.max || iso(new Date(c.y, c.m + 1, 1)) <= c.max;
  const t = hoy();
  let celdas = '';
  for (let i = 0; i < hueco; i++) celdas += '<span aria-hidden="true"></span>';
  for (let d = 1; d <= dias; d++) {
    const s = iso(new Date(c.y, c.m, d));
    const fuera = (c.min && s < c.min) || (c.max && s > c.max);
    celdas += `<button type="button" class="cal-d${s === t ? ' hoy' : ''}${s === c.sel ? ' sel' : ''}" data-a="dia" data-d="${s}" ${fuera ? 'disabled' : ''} aria-pressed="${s === c.sel}" aria-label="${capital(fechaLarga(s))}">${d}</button>`;
  }
  return `<div class="cal">
    <div class="cal-cab"><button type="button" class="cal-nav" data-a="mes" data-n="-1" ${antes ? '' : 'disabled'} aria-label="Mes anterior">‹</button><strong aria-live="polite">${titulo}</strong><button type="button" class="cal-nav" data-a="mes" data-n="1" ${despues ? '' : 'disabled'} aria-label="Mes siguiente">›</button></div>
    <div class="cal-sem" aria-hidden="true"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="cal-dias">${celdas}</div></div>`;
}
const repintarCal = () => { const el = $('#cal'); if (el && CAL) el.innerHTML = calHTML(CAL); };

async function fuentes() {
  if (!document.fonts || !document.fonts.load) return;
  try {
    await Promise.race([
      Promise.all(['800 100px "Barlow Condensed"', '700 40px "Barlow Condensed"', '400 40px Inter', '400 30px "Courier Prime"'].map(f => document.fonts.load(f))),
      new Promise(ok => setTimeout(ok, 2500)),

  } catch (e) { /* fuentes de reserva */ }
}
function lineas(g, texto, ancho, max) {
  const palabras = String(texto).split(/\s+/).filter(Boolean), out = [];
  let act = '';

    if (g.measureText(prueba).width <= ancho || !act) act = prueba; else { out.push(act); act = p; }
  }
  if (act) out.push(act);
  const recorta = l => { let s = l; while (s.length > 1 && g.measureText(s + '…').width > ancho) s = s.slice(0, -1); return s + '…'; };
  const r = out.map(l => g.measureText(l).width <= ancho ? l : recorta(l));
  if (r.length > max) { r.length = max; r[max - 1] = recorta(r[max - 1].replace(/[\s,.;:]+$/, '')); }
  return r;
}
function rect(g, x, y, w, h, r) {

  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const espacio = (g, px) => { if ('letterSpacing' in g) g.letterSpacing = px + 'px'; };

async function imagenVale(v, url) {

  await fuentes();

  const W = 1920, H = 1040, M = 70, TW = W - M * 2, TH = H - M * 2, SX = M + 1260;
  const F = { t: '"Barlow Condensed", "Arial Narrow", sans-serif', i: 'Inter, system-ui, sans-serif', m: '"Courier Prime", "Courier New", monospace' };
  const c = document.createElement('canvas'); c.width = W; c.height = H;

  g.fillText(`VALE ${numero(v.numero).toUpperCase()}`, x0, M + 112); g.globalAlpha = 1; espacio(g, 0);
  g.fillStyle = 'rgba(17,17,17,.28)'; g.fillRect(x0, M + 146, ancho, 3); g.fillStyle = NEGRO;

  const titulo = String(v.titulo || '').toUpperCase();
  let tam = 160, ls_;
  for (; tam >= 72; tam -= 4) {
    g.font = `800 ${tam}px ${F.t}`;

  }
  g.font = `800 ${tam}px ${F.t}`;
  ls_ = lineas(g, titulo, ancho, 3);

    for (const l of lineas(g, v.detalles, ancho, 3)) { if (y + 40 > tope) break; y += 52; g.fillText(l, x0, y); }
    g.globalAlpha = 1;

  const yb = M + TH - 112;
  g.fillStyle = 'rgba(17,17,17,.26)'; g.fillRect(x0, yb - 60, ancho, 3); g.fillStyle = NEGRO;
  let xc = x0;
  for (const [k, val] of [['DE', v.de], ['PARA', v.para], ['VÁLIDO', validez(v)]]) {
    g.font = `400 26px ${F.m}`; espacio(g, 4); g.globalAlpha = .65; g.fillText(k, xc, yb - 12);
    g.globalAlpha = 1; espacio(g, 0);
    g.font = `700 54px ${F.t}`;
    const t = String(val || '—').toUpperCase();
    g.fillText(t, xc, yb + 44);
    xc += Math.max(g.measureText(t).width + 70, 220);

  // Talón con el QR

  let tt = 30;
  do { g.font = `400 ${tt}px ${F.m}`; espacio(g, 4); tt -= 1; } while (g.measureText('ESCANÉALO Y ELIGE EL DÍA').width > anchoTalon && tt > 16);

  const qs = 440, qx = cx - qs / 2, qy = M + 160;

  const qr = window.qrcode(0, 'M'); qr.addData(url); qr.make();

  }
  g.font = `400 46px ${F.m}`; espacio(g, 6);
  g.fillText(codigoBonito(v.codigo), cx, qy + qs + 78); espacio(g, 0);
  g.font = `400 26px ${F.m}`; g.globalAlpha = .7;
  const host = baseWeb().replace(/^https?:\/\//, '').replace(/\/$/, '');
  g.fillText(host.length > 34 ? host.slice(0, 33) + '…' : host, cx, qy + qs + 126);
  g.globalAlpha = 1; g.textAlign = 'left';
  return await new Promise((ok, ko) => c.toBlob(b => b ? ok(b) : ko(new Error('No se ha podido crear la imagen.')), 'image/png'));
}
const nombreArchivo = (v, ext) => 'vale-' + String(v.titulo || 'plan').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) + ext;

  'descargar'() { if (!HOJA || !HOJA.blob) return aviso('Un momento, se está creando la imagen'); descargar(HOJA.blob, nombreArchivo(HOJA.v, '.png')); },
  async 'compartir'() {
    if (!HOJA || !HOJA.blob) return aviso('Un momento, se está creando la imagen');
    const { blob, v, url } = HOJA;
    const archivo = new File([blob], nombreArchivo(v, '.png'), { type: 'image/png' });
    const texto = `Vale: «${v.titulo}». Ábrelo para elegir el día: ${url}`;
    try {
      if (navigator.canShare && navigator.canShare({ files: [archivo] })) await navigator.share({ files: [archivo], text: texto });
      else if (navigator.share) await navigator.share({ text: texto, url });
      else await copiar(url, $('#url-vale'));
    } catch (e) { if (!e || e.name !== 'AbortError') { descargar(blob, nombreArchivo(v, '.png')); aviso('No se ha podido compartir; se ha descargado la imagen'); } }
  },
  'imprimir'() {
    if (!HOJA || !HOJA.dataUrl) return aviso('Un momento, se está creando la imagen');
    const p = $('#imprimir'); p.innerHTML = `<img src="${HOJA.dataUrl}" alt="">`;
    const img = $('img', p), ir = () => setTimeout(() => window.print(), 50);
    if (img.complete) ir(); else img.onload = ir;
  },
  'mes'(el) {
    CAL.m += Number(el.dataset.n);
    if (CAL.m < 0) { CAL.m = 11; CAL.y--; } if (CAL.m > 11) { CAL.m = 0; CAL.y++; }
    repintarCal();
  },
  'dia'(el) {
    CAL.sel = el.dataset.d; V.sel = CAL.sel; repintarCal();
    const b = $('#btn-canjear'); if (b) { b.disabled = false; b.textContent = textoCanjear(); }
    const d = document.querySelector(`#cal [data-d="${CAL.sel}"]`); if (d) d.focus({ preventScroll: true });
  },
  'canjear'(el) {
    if (!V || !V.sel) return;
    return ocupado(el, async () => {
      const r = await api.canjear(V.codigo, V.sel);
      V.v = norm(r); V.sel = r.fecha; V.cambiando = false; V.recien = true; CAL = null;
      pintarVale(); window.scrollTo({ top: 0, behavior: 'smooth' });
      S.listo = false;
    });
  },
  'cambiar-dia'() { V.cambiando = true; CAL = null; pintarVale(); const c = $('#cal'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  'no-cambiar'() { V.cambiando = false; V.sel = V.v.fecha; CAL = null; pintarVale(); },
  'ics-vale'() { if (V && V.v && V.v.fecha) descargar(ics(V.v), nombreArchivo(V.v, '.ics')); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = ACCIONES[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  if (e.target.id === 'nv-limitar') $('#nv-fechas').hidden = !e.target.checked;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarHoja(); });

const FORMS = {
  async entrar(f, btn) {
    const nombre = (f.querySelector('input[name="yo"]:checked') || {}).value;
    const clave = $('#clave').value;
    if (!clave) return pintarEntrar('Escribe la contraseña.', nombre);
    await ocupado(btn, async () => {
      try {
        await api.entrar(nombre, clave);
        S.yo = nombre; S.clave = clave; ls.set('planes-yo', nombre); ls.set('planes-clave', clave);
        S.listo = false; await mostrarApp();
      } catch (e) { pintarEntrar(e.message, nombre); }
    });
  },
  codigo(f) {
    const c = normCodigo($('input', f).value);
    if (c.length < 4) return aviso('Escribe el código que viene en el vale');
    irAlVale(c);
  },
  async nuevo(f, btn) {
    const titulo = $('#nv-titulo').value.trim(), detalles = $('#nv-det').value.trim();
    const limitar = $('#nv-limitar').checked;
    const desde = limitar ? ($('#nv-desde').value || null) : null, hasta = limitar ? ($('#nv-hasta').value || null) : null;
    const err = $('#nv-error'), mal = m => { err.textContent = m; err.hidden = false; };
    if (!titulo) { $('#nv-titulo').focus(); return mal('Escribe qué es el vale.'); }
    if (limitar && !desde && !hasta) return mal('Pon al menos una fecha o quita «Limitar las fechas».');
    if (hasta && hasta < hoy()) return mal('La fecha «Hasta» ya ha pasado.');
    if (desde && hasta && hasta < desde) return mal('«Hasta» tiene que ser después de «Desde».');
    err.hidden = true;
    await ocupado(btn, async () => {
      const v = norm(await api.crear({ titulo, detalles, fecha_min: desde, fecha_max: hasta }));
      S.vales.unshift(v); S.tab = 'mios'; ls.set('planes-tab', 'mios');
      pintar(); abrirQR(v.id);
    });
  },
};
document.addEventListener('submit', e => {
  const f = e.target, fn = FORMS[f.dataset.form];
  if (!fn) return;
  e.preventDefault();
  fn(f, e.submitter || f.querySelector('[type="submit"]') || (f.id && document.querySelector(`[form="${f.id}"]`)));
});
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || VISTA !== 'app' || !S.listo || !$('#hoja').hidden) return;
  await recargar(); if (VISTA === 'app' && $('#hoja').hidden) pintar();
});

// ================================================================
//  Arranque
// ================================================================
(async () => {
  try { await api.iniciar(); }
  catch (e) { $('#app').innerHTML = `<div class="wrap entrar"><div class="entrar-caja">${marca()}<p>${esc(e.message)}</p></div></div>`; return; }
  enrutar();
})();
})();
</script>
</body>
</html>
